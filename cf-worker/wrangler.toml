name = "horizon-ai-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Non-secret config. GEMINI_API_KEY is set separately via:
#   wrangler secret put GEMINI_API_KEY
# — never put API keys or secrets in this file, it's committed to git.
[vars]
# Your Firebase project ID (Firebase Console > Project Settings > General).
# Same value as VITE_FIREBASE_PROJECT_ID in app/.env.local.
FIREBASE_PROJECT_ID = "horizon-4dbf1"

# Comma-separated list of origins allowed to call this Worker. Include your
# production domain and http://localhost:5173 (Vite's default dev port) for
# local testing. No trailing slashes.
ALLOWED_ORIGINS = "http://localhost:5173"

# Stripe Price IDs (not secrets — these are safe to commit, they only
# identify which product/price, same as the ones already in your Stripe
# Dashboard). Create the "Plan" ($12/mo) and "Advisor" ($149/mo) recurring
# Prices in Stripe first, then paste their price_... IDs here.
STRIPE_PRICE_PLAN_ID = "price_REPLACE_WITH_YOUR_PLAN_PRICE_ID"
STRIPE_PRICE_ADVISOR_ID = "price_REPLACE_WITH_YOUR_ADVISOR_PRICE_ID"
